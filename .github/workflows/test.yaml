name: test
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/test.yaml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/test.yaml"
env:
  DO_NOT_TRACK: 1
  GRADIO_ANALYTICS_ENABLED: "False"
  DISABLE_TELEMETRY: 1
  HF_HUB_DISABLE_TELEMETRY: 1
  PYANNOTE_METRICS_ENABLED: 0
jobs:
  pytest:
    # Fork: upstream runs a matrix of larger runners (ubuntu-24.04-4core-x86/-arm64, macos-15-xlarge) that a personal
    # account doesn't get, so the jobs never start. This fork deploys linux/amd64 only.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q -q
          sudo apt-get install --yes ffmpeg
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          activate-environment: true
      - run: uv python install
      - run: uv sync
      # Fork: there's no OpenAI key or gated Hugging Face token here. The two realtime conversation tests aren't marked
      # `requires_openai` but create a response through the chat-completion endpoint, so they're deselected by name.
      - run: >-
          uv run pytest tests/
          -m "not requires_openai and not requires_gated_hf_model"
          --deselect "tests/realtime/realtime_conversation_test.py::test_realtime_conversation_item_create_with_previous_item_id"
          --deselect "tests/realtime/realtime_conversation_test.py::test_realtime_conversation_item_create_with_previous_item_id_root"
